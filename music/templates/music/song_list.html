<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
</head>
<body>
    <h1>Music Library</h1>
    <ul>
        {% for song in songs %}
            <li>
                <a href="{% url 'play_song' song.id %}">{{ song.title }} - {{ song.artist }}</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
